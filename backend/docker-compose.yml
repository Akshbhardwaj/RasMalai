version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: bhoomi_postgis
    environment:
      POSTGRES_DB: bhoomi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgis_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  api:
    build: .
    container_name: bhoomi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgis_password@postgis:5432/bhoomi_db
    depends_on:
      - postgis
    restart: unless-stopped

volumes:
  pgdata:
